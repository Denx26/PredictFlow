    <path d="M58 24 L66 20" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" style="fill:none;stroke:rgb(255, 255, 255);color:rgb(251, 251, 254);stroke-width:3px;stroke-dasharray:2px, 3px;stroke-linecap:round;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
